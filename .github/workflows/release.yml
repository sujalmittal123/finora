name: "\U0001F680 Release \u2014 Build APK & AAB"

# TRIGGERS:
#  1. Push a git tag (v1.2.3)     → builds & publishes that version
#  2. Push to master              → auto-detects version from pubspec.yaml
#  3. Manual workflow_dispatch    → optional tag override, else reads pubspec.yaml
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
    branches:
      - master
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag override (e.g. v1.2.0). Leave blank to auto-detect from pubspec.yaml.'
        required: false
        default: ''

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (latest stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/finora-release.jks
        shell: bash

      - name: Create key.properties
        run: |
          cat > mobile/android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../finora-release.jks
          EOF

      - name: Write google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/android/app/google-services.json

      # Resolve version — Priority: manual input > git tag > pubspec.yaml
      - name: Resolve version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            RAW="${{ github.event.inputs.tag }}"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            RAW="${GITHUB_REF#refs/tags/}"
          else
            RAW=$(grep '^version:' mobile/pubspec.yaml | head -n1 \
                  | sed -E 's/version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/v\1/')
          fi
          [[ "$RAW" != v* ]] && RAW="v${RAW}"
          VERSION="${RAW//\//-}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION}"

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Build release AAB
        working-directory: mobile
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      - name: Rename artifacts with version
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk "finora-${VERSION}.apk"
          cp mobile/build/app/outputs/bundle/release/app-release.aab "finora-${VERSION}.aab"
          ls -lh "finora-${VERSION}.apk" "finora-${VERSION}.aab"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Finora ${{ steps.version.outputs.VERSION }}"
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            ## Finora ${{ steps.version.outputs.VERSION }}

            ### Downloads
            | File | Description |
            |------|-------------|
            | `finora-${{ steps.version.outputs.VERSION }}.apk` | Android APK (direct install) |
            | `finora-${{ steps.version.outputs.VERSION }}.aab` | Android App Bundle (Play Store) |
          draft: false
          prerelease: false
          files: |
            finora-${{ steps.version.outputs.VERSION }}.apk
            finora-${{ steps.version.outputs.VERSION }}.aab
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finora-${{ steps.version.outputs.VERSION }}-apk
          path: finora-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      - name: Upload AAB to workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: finora-${{ steps.version.outputs.VERSION }}-aab
          path: finora-${{ steps.version.outputs.VERSION }}.aab
          retention-days: 30
