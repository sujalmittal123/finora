name: 🚀 Release — Build APK & AAB

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'   # triggers on v1.0.0, v1.2.3, etc.

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Java ──────────────────────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. Flutter ───────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.5'
          channel: stable
          cache: true

      # ── 4. Restore keystore from secret ──────────────────────────────────────
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > mobile/android/finora-release.jks
        shell: bash

      # ── 5. Create key.properties ─────────────────────────────────────────────
      - name: Create key.properties
        run: |
          cat > mobile/android/key.properties << EOF
          storePassword=${{ secrets.STORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../finora-release.jks
          EOF

      # ── 6. Write google-services.json ────────────────────────────────────────
      - name: Write google-services.json
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > mobile/android/app/google-services.json

      # ── 7. Flutter pub get ───────────────────────────────────────────────────
      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      # ── 8. Build APK ─────────────────────────────────────────────────────────
      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── 9. Build AAB ─────────────────────────────────────────────────────────
      - name: Build release AAB
        working-directory: mobile
        run: |
          flutter build appbundle \
            --release \
            --obfuscate \
            --split-debug-info=build/debug-info

      # ── 10. Extract version from tag ─────────────────────────────────────────
      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      # ── 11. Create GitHub Release ────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: "Finora ${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's Changed
            See commit history for full changelog.

            ## Downloads
            | File | Description |
            |------|-------------|
            | `finora-${{ steps.version.outputs.VERSION }}.apk` | Android APK (direct install) |
            | `finora-${{ steps.version.outputs.VERSION }}.aab` | Android App Bundle (Play Store) |
          draft: false
          prerelease: false
          files: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/bundle/release/app-release.aab
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 12. Rename artifacts for clarity ────────────────────────────────────
      - name: Rename artifacts
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          cp mobile/build/app/outputs/flutter-apk/app-release.apk \
             "finora-${VERSION}.apk"
          cp mobile/build/app/outputs/bundle/release/app-release.aab \
             "finora-${VERSION}.aab"

      # ── 13. Upload artifacts to workflow run ─────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-${{ steps.version.outputs.VERSION }}-apk
          path: finora-${{ steps.version.outputs.VERSION }}.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: finora-${{ steps.version.outputs.VERSION }}-aab
          path: finora-${{ steps.version.outputs.VERSION }}.aab
          retention-days: 30
